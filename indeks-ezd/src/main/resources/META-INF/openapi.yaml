      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
      - name: id
        in: path
        description: uid lub guid.
        required: true
        schema:
          type: integer       
    post:
      tags:
      - Indeksy
      summary: Dodaje id do zbioru uprwnionych inne
      operationId: dodaj_klucz_inne
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: integer
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse' 
    delete:
      tags:
      - Indeksy
      summary: Usuwa id ze zbioru uprwnionych inne
      operationId: usunj_klucz_inne
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
  /indeksy/{kod}/{klucz}/inne:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
    delete:
      tags:
      - Indeksy
      summary: usuwa wszytkiw wpisy ze zbioru uprwnionych inne
      operationId: wyczysc_klucz_inne
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
  /indeksy/{kod}/{klucz}/info:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
    get:
      tags:
      - Indeksy
      summary: Informacje techniczne
      operationId: techniczne_indeks
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'  
        400:
          $ref: '#/components/responses/ErrorResponse'


components:
  schemas:
    SuccessInfo:
      required:
        - status
      type: object
      properties:
        status:
          type: string
          description: Status
    ErrorInfo:
      required:
        - error
        - error_description
      type: object
      properties:
        error:
          type: string
          description: Kod błędu
          example: null
        error_description:
          type: string
          description: Opis błędu
          example: null
        messageId:
          type: string
          description: ID wiadomośc

    Klucz:
      description: Kucz indeksu
      type: object
      properties:
        klucz:
          type: string
        haslo:
          type: string

    KluczDane:
      allOf:
      - $ref: "#/components/schemas/Klucz"
      properties:
        sprawy:
          type: array
          items:
            type: string
        akta:
          type: array
          items:
            type: string
        negaty:
          type: array
          items:
            type: string

    Info:
      description: Informacje techniczne
      type: object
      properties:
        uid:
          type: number
        gid:
          type: number
        inne:
          type: array
          items: 
            type: number
        techniczny_id:
          type: string
        data_utworzenia:
          type: string
        data_aktualizacji:
          type: string
        uwagi:
          type: string  

  parameters:
    offset:
      in: query
      name: offset
      schema:
        type: integer
      description: przesuniecie od którego rozpoczynamy zwracie wierszy
    limit:
      in: query
      name: limit
      schema:
        type: integer
      description: liczba zwracanych wierszy
    term:
      in: query
      name: term
      schema:
        type: string
      description: filtr zapytania  

  responses:
    SuccessResponse:
      description: Success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessInfo'

    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
              