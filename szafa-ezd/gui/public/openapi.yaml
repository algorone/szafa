                $ref: '#/components/schemas/SuccessInfo' 
        400:
          $ref: '#/components/responses/ErrorResponse' 
  /indeksy/{kod}/{klucz}/negaty:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
