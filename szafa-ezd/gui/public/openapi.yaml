        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
      - name: znak
        in: path
        description: znak negatu.
        required: true
        schema:
          type: string  
    post:
      tags:
      - Indeksy
      summary: Dodaje negat pod klucz
      operationId: dodaj_pozycje_negatu
      responses:
