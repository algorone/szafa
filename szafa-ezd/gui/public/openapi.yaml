      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
      - name: uid
        in: path
        description: User ID.
        required: true
        schema:
          type: number
    post:
      tags:
      - Indeksy
      summary: Nadaje uid
      operationId: set_klucz_uid
      requestBody:
        required: false
        content:
           application/json:
            schema:
              type: string
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
          
  /indeksy/{kod}/{klucz}/gid/{gid}:
