  /indeksy/{kod}/{klucz}/info:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
    get:
      tags:
      - Indeksy
      summary: Informacje techniczne
      operationId: techniczne_indeks
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'  
        400:
          $ref: '#/components/responses/ErrorResponse'

  /dokumenty/{guid}:
    parameters:
      - name: guid
        in: path
        description: Identyfikator dokumentu.
        required: true
        schema:
          type: string  
    get:
      tags:
      - Dokumenty
      operationId: pobierz_dokument
      summary: Zwraca dukument o zadanym guid
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
      - Dokumenty    
      summary: Dodaje dokument do repozytorium
      operationId: dodaj_dokument
      requestBody:
        required: true
        content:
          application/binary:
            schema:
              type: string
              format: binary
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'        
    patch:
      tags:
      - Dokumenty    
      summary: Aktualizuje dokument w repozytorium
      operationId: aktualizuj_dokument
      description: Robi kopie aktualnego dokumentu i zapisuje pod historią
      requestBody:
        required: true
        content:
          application/binary:
            schema:
              type: string
              format: binary
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                type: string
        400:
          $ref: '#/components/responses/ErrorResponse'      
    delete:
      tags:
      - Dokumenty    
      summary: Usuwa dokument
      operationId: usun_dokument
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'

  /dokumenty/{guid}/info:
    parameters:
