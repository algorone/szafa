          type: string
        haslo:
          type: string

    KluczDane:
      allOf:
      - $ref: "#/components/schemas/Klucz"
      properties:
        sprawy:
          type: array
          items:
            type: string
        akta:
          type: array
          items:
            type: string
        negaty:
          type: array
          items:
            type: string

    Agregat:
      allOf:
      - $ref: "#/components/schemas/Klucz"
      properties:
        sprawy:
          type: array
          items:
            $ref: '#/components/schemas/Sprawa'
        akta:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/AktaPozostale'
              - $ref: '#/components/schemas/AktaWplywajace'
              - $ref: '#/components/schemas/AktaWychodzace'
        negaty:
          type: array
          items:
            $ref: '#/components/schemas/Negat'

  parameters:
    offset:
      in: query
      name: offset
      schema:
        type: integer
      description: przesuniecie od ktrego rozpoczynamy zwracie wierszy
    limit:
      in: query
      name: limit
      schema:
        type: integer
      description: liczba zwaracanych wierszy
    term:
      in: query
      name: term
      schema:
        type: string
      description: filtr zapytania     

  responses:
    SuccessResponse:
      description: Success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessInfo'

    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInfo'
              
