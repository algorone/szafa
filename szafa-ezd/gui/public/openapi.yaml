      - name: znak
        in: path
        description: znak sprawy
        required: true
        schema:
          type: string
    post:
      tags:
      - Negaty
      summary: Dodaje wpis do metryki sprawy
      operationId: dodaj_czynnosc_negatu
      requestBody:
        required: false
        content:
           application/json:
            schema:
              $ref: '#/components/schemas/Czynnosc'
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
  /negaty/{znak}/akta:
    parameters:
      - name: znak
        in: path
        description: znak negatu
        required: true
        schema:
          type: string
    get:
      tags:
      - Negaty
      summary: Lista akt przypisanych do negatu
      operationId: akta_negatu
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                  - $ref: '#/components/schemas/AktaWychodzace'
                  - $ref: '#/components/schemas/AktaWplywajace'
                  - $ref: '#/components/schemas/AktaPozostale'
  /negaty/{znak}/info:
    parameters:
      - name: znak
        in: path
        description: techniczny znak negatu
        required: true
        schema:
          type: string
    get:
      tags:
      - Negaty
      operationId: techiczne_negatu
      summary: Informacje techniczne
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'  
        400:
          $ref: '#/components/responses/ErrorResponse'          
  /negaty/{znak}/uid/{uid}:
    parameters:
      - name: znak
        in: path
        description: techniczny znak negatu
        required: true
        schema:
          type: string
      - name: uid
        in: path
        description: User ID.
        required: true
        schema:
          type: number
    post:
      tags:
      - Negaty
      summary: Nadaje uid
      operationId: set_negaty_uid
      requestBody:
        required: false
        content:
           application/json:
            schema:
              type: string
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
          
  /negaty/{znak}/gid/{gid}:
    parameters:
      - name: znak
        in: path
        description: znak negatu
        required: true
        schema:
          type: string
      - name: gid
        in: path
        description: Group ID.
        required: true
        schema:
          type: number
    post:
      tags:
      - Negaty
      summary: Nadaje gid
      operationId: set_nagat_gid
      requestBody:
        required: false
        content:
           application/json:
            schema:
              type: string
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
          
  /negaty/{znak}/inne/{id}:
    parameters:
      - name: znak
        in: path
        description: znak negatu
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: uid lub guid.
        required: true
        schema:
          type: number       
    post:
      tags:
      - Negaty
      summary: Dodaje id do zbioru uprwnionych inne
      operationId: dodaj_negat_inne
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: number
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse' 
    delete:
      tags:
      - Negaty
      summary: Usuwa id ze zbioru uprwnionych inne
      operationId: usunj_negat_inne
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
  /negaty/{znak}/inne:
    parameters:
      - name: znak
        in: path
        description: znak negatu
        required: true
        schema:
          type: string
    delete:
      tags:
      - Negaty
      summary: usuwa wszytkiw wpisy ze zbioru uprwnionych inne
      operationId: wyczysc_negat_inne
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'  

components:
  schemas:
    SuccessInfo:
      required:
        - status
      type: object
      properties:
        status:
          type: string
          description: Status
    ErrorInfo:
      required:
        - error
        - error_description
      type: object
      properties:
        error:
          type: string
          description: Kod błędu
          example: null
        error_description:
          type: string
          description: Opis błędu
          example: null
        messageId:
          type: string
          description: ID wiadomośc
    
    DokumentInfo:
      description: Informacje o dokumecie w repozytorium dokumentow elektornicznych
      type: object
      properties:
        guid:
          type: string
        rozmiar:
          type: number
        mime:
          type: string
        uid:
          type: number
        gid:
          type: number
        inne:
          type: array
          items: 
            type: number
        data_utworzenia:
