  /dokumenty/{guid}/poprzednie:
    parameters:
      - name: guid
        in: path
        description: Identyfikator dokumentu.
        required: true
        schema:
          type: string  
    get:
      tags:
      - Dokumenty
      summary: Zwraca liste z URI do porzednich wersji dokumentu
      operationId: poprzednie_wersje
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DokumentWersja' 
        400:
          $ref: '#/components/responses/ErrorResponse' 
  /dokumenty/{guid}/poprzednie/{wersja}:
    parameters:
      - name: guid
        in: path
        description: Identyfikator dokumentu.
        required: true
        schema:
          type: string  
      - name: wersja
        in: path
        description: wersja dokumentu.
        required: true
        schema:
          type: integer
    get:
      tags:
      - Dokumenty
      summary: Zwraca poprzednia wersje dokumentu
      operationId: poprzednia_wersja_dokumentu
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: '#/components/responses/ErrorResponse' 
  /rwa:
    get:
      tags:
      - Struktura
      operationId: lista_rwa
      summary: Zwraca dostpene lata dla których przechowujemy RWA
      responses:
        200:
          description: Linki do RWA
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        400:
          $ref: '#/components/responses/ErrorResponse' 
  /rwa/{rok}:
    parameters:
      - name: rok
        in: path
        description: rok w formacie YYYY
        required: true
        schema:
          type: integer  
    get:
      tags:
      - Struktura
      operationId: rwa_na_rok
      summary: Zwraca RWA dla zadanego roku
      responses:
        200:
          description: RWA
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pozycja_RWA' 
        400:
          $ref: '#/components/responses/ErrorResponse' 
    post:
      tags:
      - Struktura
      summary: Dodaje/modyfikuje kompletne RWA dla zadanego roku 
      operationId: dodaj_rwa
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Pozycja_RWA' 
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
