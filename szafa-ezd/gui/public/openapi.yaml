openapi: 3.0.3
servers:
  - url: http://HOST_NAME/ezd/api
  - url: https://HOST_NAME/ezd/api
info:
  title: EZD API
  version: 1.0.1
  description: |
    <p>
    Specyfikacja API EZD <br> 2026 @ Algor informatyzacja Przesiębiorstw Sp. z o.o.
    </p>

tags:
  - name: Agregaty
    description: Obsluga zagregowanych danych
  - name: Indeksy
    description: Obsługa indeksów
  - name: Dokumenty
    description: Obsługa dokumentow w repozytorium dokumentów eletronicznych
  - name: Struktura
    description: Ogranizacja szafy
  - name: Klasyfikacje
    description: Obsługa klasyfikacji spraw
  - name: Sprawy
    description: Obsługa metadnych akt i spraw
  - name: Akta
    description: Obsługa metadnych akt
  - name: Negaty
    description: Obsługa metryk do akt nie stanowiacych sprawy

paths:
  /agregaty/klucz:
    post: #TODO query
      tags: 
      - Agregaty
      summary: Zwraca zagregowana dane z klucza danych
      operationId: pobierz_agregat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KluczDane' 
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agregat' 
        400:
          $ref: '#/components/responses/ErrorResponse'  
  /agregaty/export:
    post: #TODO query
      tags: 
      - Agregaty
      summary: Zleca przygotowanie exportu danych do dokumentu pod zwracanym URI 
      operationId: przygotuj_export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              AnyValue: {}
      responses:
        200:
          description: Zwraca URI do dokumentu z danymi eksporty
          content:
            text/plain:
              schema:
                type: string
                format: uri
                example: '/dokumnty/12233'
        400:
          $ref: '#/components/responses/ErrorResponse'  
  /indeksy/{kod}:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
    get:
      tags:
      - Indeksy
      operationId: pobierz_indeks
      summary: Wyszukuje dane indeksu
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/term"
      responses:
        200:
          description: lista kluczy
          headers:
            x-result-count:
              schema:
                type: integer
            x-requested-limit:
              schema:
                type: integer
            x-requested-offset:
              schema:
                type: integer                  
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Klucz' 
        400:
          $ref: '#/components/responses/ErrorResponse'

  /indeksy/{kod}/{klucz}:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
    get:
      tags:
      - Indeksy
      operationId: pobierz_dane
      summary: Zwraca dane indeksu o zadanym kluczu
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KluczDane' 
        400:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
      - Indeksy    
      summary: Dodaje klucz indeksu
      operationId: dodaj_klucz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KluczDane' 
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'        
    patch:
      tags:
      - Indeksy    
      summary: Aktualizuje hasło klucza
      operationId: aktualizuj_haslo
      description: Aktualizue hasło indeksu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Klucz' 
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'      
    delete:
      tags:
      - Indeksy    
      summary: Usuwa dane indeksu pod zadanym kluczem
      operationId: usun_klucz
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
  /indeksy/{kod}/{klucz}/sprawy:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string
    put:
      tags:
      - Indeksy    
      summary: Wstawia sprawy pod klucz
      operationId: wstaw_sprawy_pod_klucz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        200:
          $ref: '#/components/responses/SuccessResponse' 
        400:
          $ref: '#/components/responses/ErrorResponse'
  /indeksy/{kod}/{klucz}/sprawy/{znak}:
    parameters:
      - name: kod
        in: path
        description: Identyfikator indeksu.
        required: true
        schema:
          type: string 
      - name: klucz
        in: path
        description: Klucz indeksu.
        required: true
        schema:
          type: string  
      - name: znak
        in: path
        description: znak sprawy.
        required: true
        schema:
          type: string  
    post:
      tags:
      - Indeksy
      summary: Dodaje sprawe pod klucz
      operationId: dodaj_pozycje_sprawy
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessInfo' 
        400:
          $ref: '#/components/responses/ErrorResponse' 
    delete:
      tags:
      - Indeksy
      summary: Usuwa sprawe spod klucza
      operationId: usun_pozycje_sprawy
      responses:
        200:
          description: Operacja wykonana poprawnie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessInfo' 
        400:
          $ref: '#/components/responses/ErrorResponse' 
  /indeksy/{kod}/{klucz}/akta:
